name: Eval Regression Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  eval:
    name: Run Evaluation Harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Download spaCy model (required by Presidio PII scrubber)
        run: python -m spacy download en_core_web_lg

      - name: Run regression suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Force stdout/stderr to UTF-8 so Unicode in LLM output
          # never triggers a codec error in the CI runner.
          PYTHONIOENCODING: "utf-8"
        run: |
          cd backend
          python -m evals.run_regression
